<div class="backdrop" data-subscription-modal>
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="subscription-title"
  >
    <button
      class="modal-close-icon"
      type="button"
      aria-label="Close modal"
      data-modal-close
    >
      <span aria-hidden="true">&times;</span>
    </button>
    <img
      class="modal-image"
      src="./img/register-workshop-400.webp"
      srcset="
        ./img/register-workshop-400.webp 400w,
        ./img/register-workshop-800.webp 800w
      "
      sizes="280px"
      width="2844"
      height="2844"
      alt="Outdoor art class with students painting nature"
      loading="lazy"
      decoding="async"
    />
    <h2 id="subscription-title" class="modal-title">Registration preview</h2>
    <p class="modal-text">
      This form is a demonstration. Your details have not been sent and no
      booking has been made.
    </p>
    <button class="button" type="button" data-modal-close>Close</button>
  </div>
</div>
